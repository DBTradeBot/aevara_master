name: aevara_app
description: Aevara UI skeleton (no backend) with pages/components wired and a dev debugger.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0   # <-- add this
  cupertino_icons: ^1.0.6
  google_fonts: ^6.3.0
  flutter_riverpod: ^2.6.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_analytics: ^12.0.0
  cloud_functions: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
