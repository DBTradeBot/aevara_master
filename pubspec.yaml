name: aevara_app
description: Aevara UI skeleton (no backend) with pages/components wired and a dev debugger.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.3.0
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_analytics: ^12.0.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0
  # Other
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  # Lottie animations (for coach avatar etc.)
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/coach_avatar.json   # <-- changed from .lottie to .json
