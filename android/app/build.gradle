plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.aevara_master"

    // Use Flutter's compileSdkVersion, or hardcode to 34 if you prefer.
    compileSdk = flutter.compileSdkVersion

    // Force NDK version to match what path_provider_android requires.
    ndkVersion "25.1.8977393"

    defaultConfig {
        applicationId = "com.example.aevara_master"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // AGP 8.x expects Java 17 toolchain.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // TODO: replace with real signing config
        }
    }
}

flutter {
    source = "../.."
}
