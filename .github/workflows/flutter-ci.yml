name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug: show repo files
        run: |
          pwd
          ls -la
          if [ -d test ]; then echo "test/ exists"; ls -la test; else echo "test/ NOT found"; fi
          if [ -f pubspec.yaml ]; then echo "pubspec.yaml found"; fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests (only if tests exist)
        if: ${{ hashFiles('test/**') != '' }}
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
